name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '21'
            magicspells: '4.0-Beta-17'
            paper: '1.21.4-R0.1-SNAPSHOT'
          - os: windows-latest
            java: '21'
            magicspells: '4.0-Beta-17'
            paper: '1.21.4-R0.1-SNAPSHOT'
          - os: ubuntu-latest
            java: '21'
            magicspells: '4.0-Beta-18'
            paper: '1.21.11-R0.1-SNAPSHOT'
          - os: ubuntu-latest
            java: '25'
            magicspells: '4.0-Beta-19'
            paper: '1.21.4-R0.1-SNAPSHOT'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java || '21' }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew clean build runtimeProbeJar --console=plain -PcompilerJava=${{ matrix.java || '21' }} -PmagicSpellsVersion=${{ matrix.magicspells || '4.0-Beta-17' }} -PpaperVersion=${{ matrix.paper || '1.21.4-R0.1-SNAPSHOT' }}
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean build runtimeProbeJar --console=plain
      - name: Upload plugin and sources
        uses: actions/upload-artifact@v4
        with:
          name: MagicRecoil-${{ runner.os }}-${{ matrix.magicspells || '4.0-Beta-17' }}
          path: build/libs/*.jar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}-${{ matrix.magicspells || '4.0-Beta-17' }}
          path: build/reports/tests/test/
