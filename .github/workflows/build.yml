name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew clean build runtimeProbeJar --console=plain
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean build runtimeProbeJar --console=plain
      - name: Upload plugin and sources
        uses: actions/upload-artifact@v4
        with:
          name: MagicRecoil-${{ runner.os }}
          path: build/libs/*.jar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}
          path: build/reports/tests/test/
