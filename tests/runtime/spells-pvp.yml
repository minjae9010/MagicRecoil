# Two real Player entities on a disposable server; hooks record classifications in the diagnostic plugin.
MR_PVP_Hit:
  spell-class: dev.magicrecoil.spells.HitSpell
  helper-spell: true
  range: 32
  can-target: [players]
  damage: 2
  headshot-entities: [PLAYER]
  headshot-height: 0.25
  headshot-multiplier: 2
  direction-multipliers: {front: 1, back: 1.5, left: 1.1, right: 1.2, above: 1.3, below: 1.4}
  spell-on-hit: MR_PVP_hook_hit
  spell-on-headshot: MR_PVP_hook_head
  spell-on-bodyshot: MR_PVP_hook_body
  spell-on-front: MR_PVP_hook_front
  spell-on-back: MR_PVP_hook_back
  spell-on-left: MR_PVP_hook_left
  spell-on-right: MR_PVP_hook_right
  spell-on-above: MR_PVP_hook_above
  spell-on-below: MR_PVP_hook_below
MR_PVP_Projectile:
  spell-class: .instant.ParticleProjectileSpell
  can-target: [players]
  projectile-velocity: 40
  projectile-gravity: 0
  projectile-spread: 0
  start-x-offset: 0
  start-y-offset: 1.62
  start-z-offset: 0
  tick-interval: 1
  intermediate-hitboxes: 16
  max-distance: 32
  hit-players: true
  hit-non-players: false
  hit-radius: 0.03
  vertical-hit-radius: 0.03
  spell-on-hit-entity: "MR_PVP_Hit(targeting=entity_from_location)"
